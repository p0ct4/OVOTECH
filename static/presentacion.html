
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVOTECH - Incubadora Inteligente</title>

    <link rel="stylesheet" href="presentacion.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>

    <!-- VINCULAR INCUBADORA -->
    <section id="pantalla-vinculacion" class="pantalla">

        <a href="index.html" class="volver">← Volver</a>

        <div class="contenedor login">

            <div class="logo">
                <i class="fa-brands fa-earlybirds"></i>
            </div>

            <h1>OVOTECH</h1>
            <p class="subtitulo">Incubadora inteligente</p>

            <label for="deviceIdInput">ID de tu incubadora</label>

            <input
                type="text"
                id="deviceIdInput"
                placeholder="Ingresá el ID"
                maxlength="50"
                autocomplete="off"
            >

            <button onclick="vincularDispositivo()">
                Conectar
            </button>

            <p id="vinculacionMsg" class="mensaje"></p>

        </div>
    </section>


    <!-- PANTALLA PRINCIPAL -->
    <section id="pantalla-principal" class="pantalla" style="display: none;">

        <header>
            <div>
                <h2>
                    <i class="fa-brands fa-earlybirds"></i>
                    OVOTECH
                </h2>
                <small id="miDeviceId">--</small>
            </div>

            <div class="acciones">

                <div id="connection" class="conexion">
                    <span class="status-dot"></span>
                    <span class="status-text">Desconectado</span>
                </div>

                <button class="btn-cambiar" onclick="desvincularDispositivo()" title="Cambiar incubadora">
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                </button>

            </div>
        </header>


        <main class="contenedor">

            <h1>Mi incubadora</h1>
            <p class="subtitulo">Monitoreo en tiempo real</p>

            <div class="sensores">

                <!-- TEMPERATURA -->
                <div class="sensor">

                    <div class="sensor-icono temperatura">
                        <i class="fa-solid fa-temperature-half"></i>
                    </div>

                    <h3>Temperatura</h3>

                    <div class="valor" id="tempValue">--.-°C</div>

                    <p id="tempStatus">Esperando datos...</p>

                </div>


                <!-- HUMEDAD -->
                <div class="sensor">

                    <div class="sensor-icono humedad">
                        <i class="fa-solid fa-droplet"></i>
                    </div>

                    <h3>Humedad</h3>

                    <div class="valor" id="humValue">--.-%</div>

                    <p id="humStatus">Esperando datos...</p>

                </div>

            </div>

        </main>

        <footer>
            OVOTECH • Incubadora inteligente
            <span id="footer-device" hidden>--</span>
        </footer>

    </section>

    <script src="script.js"></script>

</body>
</html>
